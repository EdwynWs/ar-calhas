# Linux: rede do host preserva o IP TCP do aparelho. Sem proxy nem portas publicadas.
services:
  ar-calhas:
    build: .
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      ACCESS_MODE: ${ACCESS_MODE:-local}
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      ALLOWED_CLIENT_IPS: ${ALLOWED_CLIENT_IPS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DB_PATH: /app/data/ar-calhas.sqlite
    volumes:
      - ar_calhas_data:/app/data
      - ar_calhas_backups:/app/backups
    restart: unless-stopped
volumes:
  ar_calhas_data:
  ar_calhas_backups:
